<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" fill="none">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; rx: 12px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    
    .social-box {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
      rx: 8px;
    }

    .social-box:hover {
      stroke: #58a6ff;
    }

    .social-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #e6edf3;
    }

    .social-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      fill: #8b949e;
    }
  </style>

  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Terminal Header Bar -->
  <rect x="0" y="0" width="800" height="36" fill="#161b22" rx="12" />
  <rect x="0" y="24" width="800" height="12" fill="#161b22" />
  <circle cx="22" cy="18" r="5" fill="#ff5f56" />
  <circle cx="38" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="18" r="5" fill="#27c93f" />
  <text x="400" y="22" font-family="'Fira Code', monospace" font-size="12" fill="#8b949e" text-anchor="middle">Zeyad_Connect_&amp;_Social_Links.sh</text>
  <line x1="0" y1="36" x2="800" y2="36" stroke="#30363d" stroke-width="1" />

