<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1410" viewBox="0 0 800 1410" fill="none">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; rx: 12px; }
    .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    
    .status-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #3fb950;
    }

    .text-main {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 22px;
      font-weight: 700;
      fill: #58a6ff;
    }

    .text-sub {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 18px;
      font-weight: 600;
      fill: #7ee787;
    }

    /* Typewriter animation keyframes */
    .type-line1 { animation: type1 16s steps(38, end) infinite; }
    @keyframes type1 {
      0% { width: 0px; }
      15%, 90% { width: 620px; }
      98%, 100% { width: 0px; }
    }

    .type-role1 { animation: r1 16s steps(25, end) infinite; }
    .type-role2 { animation: r2 16s steps(30, end) infinite; }
    .type-role3 { animation: r3 16s steps(30, end) infinite; }
    .type-role4 { animation: r4 16s steps(25, end) infinite; }

    @keyframes r1 { 0%, 5% { width: 0px; } 10%, 22% { width: 400px; } 24%, 100% { width: 0px; } }
    @keyframes r2 { 0%, 27% { width: 0px; } 32%, 47% { width: 480px; } 49%, 100% { width: 0px; } }
    @keyframes r3 { 0%, 52% { width: 0px; } 57%, 72% { width: 480px; } 74%, 100% { width: 0px; } }
    @keyframes r4 { 0%, 77% { width: 0px; } 82%, 94% { width: 420px; } 96%, 100% { width: 0px; } }

    .glow { filter: drop-shadow(0px 0px 8px rgba(88, 166, 255, 0.45)); }

    /* Laser animation */
    .pulse-line { stroke: #30363d; stroke-width: 2; }
    .laser-beam { stroke: #58a6ff; stroke-width: 3; stroke-dasharray: 20 80; animation: laser 2.5s linear infinite; }
    .laser-beam-green { stroke: #7ee787; stroke-width: 3; stroke-dasharray: 20 80; animation: laser 2.5s linear infinite 0.8s; }
    @keyframes laser { 0% { stroke-dashoffset: 100; } 100% { stroke-dashoffset: 0; } }

    .node-text { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .status-text { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8b949e; }

    .label-text { font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #7ee787; }
    .val-text { font-family: -apple-system, sans-serif; font-size: 14px; fill: #c9d1d9; }
    .link-text { font-family: -apple-system, sans-serif; font-size: 14px; fill: #58a6ff; }

    .cat-title { font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #58a6ff; }
    .badge { fill: #161b22; stroke: #30363d; rx: 6px; }
    .badge-text { font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #e6edf3; }

    .social-box { fill: #161b22; stroke: #30363d; rx: 8px; }
    .social-title { font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #e6edf3; }
    .social-sub { font-family: -apple-system, sans-serif; font-size: 11px; fill: #8b949e; }

    .phase-title { font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
    .phase-sub { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8b949e; }
    .arrow { font-family: monospace; font-size: 20px; fill: #58a6ff; animation: pulse 1.5s infinite alternate; }
    @keyframes pulse { 0% { opacity: 0.4; fill: #58a6ff; } 100% { opacity: 1; fill: #7ee787; } }
  </style>

  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <clipPath id="clip1"><rect x="30" y="55" height="40" class="type-line1" width="0" /></clipPath>
    <clipPath id="clipRole1"><rect x="30" y="100" height="40" class="type-role1" width="0" /></clipPath>
    <clipPath id="clipRole2"><rect x="30" y="100" height="40" class="type-role2" width="0" /></clipPath>
    <clipPath id="clipRole3"><rect x="30" y="100" height="40" class="type-role3" width="0" /></clipPath>
    <clipPath id="clipRole4"><rect x="30" y="100" height="40" class="type-role4" width="0" /></clipPath>
  </defs>

  <!-- Outer Master Container -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Master Terminal Header Bar -->
  <rect x="0" y="0" width="800" height="40" fill="#161b22" rx="12" />
  <rect x="0" y="28" width="800" height="12" fill="#161b22" />
  <circle cx="22" cy="20" r="5" fill="#ff5f56" />
  <circle cx="38" cy="20" r="5" fill="#ffbd2e" />
