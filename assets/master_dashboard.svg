    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="620" y="23" class="status-badge">Available for Opportunities</text>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#30363d" stroke-width="1" />

  <!-- SECTION 1: ANIMATED HEADER -->
  <g transform="translate(0, 10)">
    <g clip-path="url(#clip1)" class="glow">
      <text x="30" y="80" class="text-main">$ echo "Hi, I'm Zeyad Mohamed Elfaramawy"</text>
    </g>
    <g clip-path="url(#clipRole1)"><text x="30" y="122" class="text-sub">&gt; AI Engineer</text></g>
    <g clip-path="url(#clipRole2)"><text x="30" y="122" class="text-sub">&gt; Machine Learning Engineer</text></g>
    <g clip-path="url(#clipRole3)"><text x="30" y="122" class="text-sub">&gt; AI Automation Developer</text></g>
    <g clip-path="url(#clipRole4)"><text x="30" y="122" class="text-sub">&gt; Mobile App Developer</text></g>
  </g>

  <line x1="30" y1="160" x2="770" y2="160" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4" />

