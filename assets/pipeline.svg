<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" fill="none">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; rx: 12px; }
    .node-box { fill: #161b22; stroke: #30363d; stroke-width: 1.5px; rx: 8px; }
    .node-active { fill: #161b22; stroke: #58a6ff; stroke-width: 1.5px; rx: 8px; }
    
    .node-text {
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #e6edf3;
    }
    
    .status-text {
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 11px;
      fill: #8b949e;
    }

    .pulse-line {
      stroke: #30363d;
      stroke-width: 2;
    }

    .laser-beam {
      stroke: #58a6ff;
      stroke-width: 3;
      stroke-dasharray: 20 80;
      animation: laser 2.5s linear infinite;
    }

    .laser-beam-green {
      stroke: #7ee787;
      stroke-width: 3;
      stroke-dasharray: 20 80;
      animation: laser 2.5s linear infinite 0.8s;
    }

    @keyframes laser {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .glow {
      filter: drop-shadow(0px 0px 6px rgba(88, 166, 255, 0.6));
    }
  </style>

  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Terminal Header -->
  <rect x="0" y="0" width="800" height="36" fill="#161b22" rx="12" />
  <rect x="0" y="24" width="800" height="12" fill="#161b22" />
  <circle cx="20" cy="18" r="5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="18" r="5" fill="#27c93f" />
  <text x="400" y="22" font-family="'Fira Code', monospace" font-size="12" fill="#8b949e" text-anchor="middle">Zeyad_AI_Architecture_Pipeline.v2</text>
  <line x1="0" y1="36" x2="800" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Connecting Lines with Laser Animation -->
  <line x1="150" y1="110" x2="250" y2="110" class="pulse-line" />
  <line x1="150" y1="110" x2="250" y2="110" class="laser-beam" />

  <line x1="370" y1="110" x2="470" y2="110" class="pulse-line" />
  <line x1="370" y1="110" x2="470" y2="110" class="laser-beam-green" />

  <line x1="590" y1="110" x2="670" y2="110" class="pulse-line" />
  <line x1="590" y1="110" x2="670" y2="110" class="laser-beam" />

  <!-- Node 1: Input / Prompt -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="120" height="60" class="node-box" />
    <text x="60" y="28" text-anchor="middle" class="node-text">💬 Prompt</text>
    <text x="60" y="46" text-anchor="middle" class="status-text">[User Query]</text>
  </g>

  <!-- Node 2: RAG & Vector DB -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="120" height="60" class="node-active glow" />
    <text x="60" y="28" text-anchor="middle" class="node-text" fill="#58a6ff">⚡ RAG Engine</text>
    <text x="60" y="46" text-anchor="middle" class="status-text" fill="#7ee787">[Retrieval]</text>
  </g>

  <!-- Node 3: AI Agent & LLMs -->
  <g transform="translate(470, 80)">
    <rect x="0" y="0" width="120" height="60" class="node-active glow" />
    <text x="60" y="28" text-anchor="middle" class="node-text" fill="#7ee787">🤖 AI Agent</text>
    <text x="60" y="46" text-anchor="middle" class="status-text" fill="#58a6ff">[n8n Workflows]</text>
  </g>

  <!-- Node 4: Mobile Output -->
  <g transform="translate(670, 80)">
    <rect x="0" y="0" width="100" height="60" class="node-box" />
    <text x="50" y="28" text-anchor="middle" class="node-text">📱 Flutter</text>
    <text x="50" y="46" text-anchor="middle" class="status-text">[Mobile App]</text>
  </g>

  <!-- Terminal Live Execution Log at Bottom -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="740" height="45" fill="#161b22" stroke="#30363d" rx="6" />
    <text x="15" y="26" font-family="'Fira Code', monospace" font-size="12" fill="#7ee787">❯ EXECUTE:</text>
    <text x="105" y="26" font-family="'Fira Code', monospace" font-size="12" fill="#e6edf3">Processing RAG query ➔ Triggering n8n Workflow ➔ Deploying Flutter UI...</text>
    <circle cx="715" cy="22" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <rect x="0" y="236" width="800" height="4" fill="url(#edgeGrad)" />
</svg>
